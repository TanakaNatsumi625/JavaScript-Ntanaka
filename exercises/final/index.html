<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    background: #f0f8ff;
  }

  .eye {
    transition: transform 0.1s;
    transform-origin: center;
  }
</style>
<!-- <link rel="stylesheet" href="index.css" /> -->
</head>
<body>
<svg viewBox="0 0 200 200" width="300">

  <!-- 耳（左） -->
  <g id="earL">
    <ellipse cx="40" cy="60" rx="20" ry="60"
      fill="#ffffff"
      stroke="#888" stroke-width="2"/>
  </g>

  <!-- 耳（右） -->
  <g id="earR">
    <ellipse cx="160" cy="60" rx="20" ry="60"
      fill="#ffffff"
      stroke="#888" stroke-width="2"/>
  </g>

  <!-- 体 -->
  <g id="body">
    <ellipse cx="100" cy="130" rx="45" ry="35"
      fill="#ffffff"
      stroke="#aaa" stroke-width="2"/>
  </g>

  <!-- 顔 -->
  <g id="face">
    <ellipse cx="100" cy="90" rx="50" ry="40"
      fill="#ffffff"
      stroke="#888" stroke-width="2"/>
  </g>

  <!-- 目 -->
  <g id="eyes">
    <ellipse id="eyeL" cx="85" cy="85" rx="4" ry="6" fill="#444"/>
    <ellipse id="eyeR" cx="115" cy="85" rx="4" ry="6" fill="#444"/>
  </g>

  <!-- 口 -->
  <path d="M85 105 Q100 115 115 105"
    stroke="#666"
    fill="transparent"
    stroke-width="2"/>

</svg>


<script>
const body = document.getElementById("body");
const face = document.getElementById("face");
const eyeL = document.getElementById("eyeL");
const eyeR = document.getElementById("eyeR");

let t = 0;
let blinkScale = 1; // ← 瞬き状態を管理（重要）

function animate() {
  t += 0.05;

  // 🌬️ 体（呼吸）
  const bodyY = Math.sin(t) * 5;

  // 🙂 顔（少し遅れて動く）
  const faceY = Math.sin(t - 0.3) * 4;
  const faceRot = Math.sin(t * 0.7) * 2;

  // 👀 目（独立した動き）
  const eyeY = Math.sin(t * 1.3) * 2;
  const eyeXL = Math.sin(t * 0.8) * 2;
  const eyeXR = Math.sin(t * 1.1) * 2;

  // 体・顔
  body.setAttribute("transform", `translate(0, ${bodyY})`);
  face.setAttribute(
    "transform",
    `translate(0, ${faceY}) rotate(${faceRot},100,90)`
  );

  // 👁️ 目（位置＋瞬きを合成するのがポイント）
  eyeL.setAttribute(
    "transform",
    `translate(${eyeXL}, ${eyeY}) scale(1, ${blinkScale})`
  );

  eyeR.setAttribute(
    "transform",
    `translate(${eyeXR}, ${eyeY}) scale(1, ${blinkScale})`
  );

  requestAnimationFrame(animate);
}

animate();


// 👁️ 瞬き（壊れない版）
function blink() {
  blinkScale = 0.1; // 閉じる

  setTimeout(() => {
    blinkScale = 1; // 開く
  }, 120);
}



</script>


</body>
</html>
